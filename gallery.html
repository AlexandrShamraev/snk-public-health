<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея СНК</title>
    <link rel="icon" type="image/png" href="Эмблема.png">
    
    <!-- Подключение шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#1B2A4A',
                        light: '#F8F9FA',
                        accent: '#8C99A6'
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Плавное появление фото при загрузке */
        .fade-in { animation: fadeIn 0.8s ease-in-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Стили для модального окна (Lightbox) */
        #lightbox {
            backdrop-filter: blur(5px);
            transition: opacity 0.3s ease;
        }
        #lightbox.hidden { opacity: 0; pointer-events: none; }
        #lightbox.visible { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="bg-light text-navy font-sans antialiased selection:bg-accent/30 min-h-screen flex flex-col">

    <!-- Навигация -->
    <nav class="w-full py-6 px-8 flex justify-between items-center bg-white shadow-sm sticky top-0 z-40">
        <div class="font-serif text-xl font-bold tracking-wider">Галерея СНК</div>
        <a href="index.html" class="px-6 py-2 border border-navy/20 rounded-md text-sm tracking-widest uppercase hover:bg-navy hover:text-white transition-colors duration-300">
            Назад на главную
        </a>
    </nav>

    <!-- Основной контент галереи -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-6 py-12 md:py-20">
        <h1 class="font-serif text-4xl md:text-5xl font-bold text-center mb-16">Командная работа и моменты</h1>
        
        <!-- Сетка галереи (заполняется через JS) -->
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Фотографии появятся здесь -->
        </div>
    </main>

    <!-- Модальное окно (Lightbox) -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-navy/90 flex items-center justify-center hidden" onclick="closeLightbox()">
        <span class="absolute top-6 right-8 text-white text-4xl cursor-pointer hover:text-accent transition-colors">&times;</span>
        <img id="lightbox-img" src="" alt="Увеличенное фото" class="max-h-[90vh] max-w-[90vw] object-contain rounded-sm shadow-2xl" onclick="event.stopPropagation()">
    </div>

    <!-- Скрипт генерации и логики -->
    <script>
        // Массив со всеми названиями загруженных фотографий
        const photos = [
            "1a2eeb79-a515-444b-92d8-55941b012720.jfif", "1e4be88b-5494-4906-b6e6-8e071d770975.jfif",
            "3d4d2c40-3edb-4664-9e9d-f1783a1d2915.jfif", "4afab903-7772-4e00-87a6-29b0c2db0c72.jfif",

            "8a857ebb-ee3f-446b-93cd-e1306f2f21d5.jfif", "16d0e7d7-3695-4198-b5f2-1baf108fc4e1.jfif",
            "7853c873-02fd-4351-b307-587799ccab23.jfif", "65c160b4-5f9d-497c-929b-264fe61032bb.jfif",
            "0077f61a-aec6-453a-ab8d-42fbe03c09d8.jfif", "86c1e888-e024-46f3-ae26-340f3b6ab7a3.jfif",
            "88bfdb5e-973a-44be-a811-afa236efc3c4.jfif", "91e9616f-b37f-4e62-9e94-d6f90892de6a.jfif",

            "f6c00adf-e370-4fe0-87a1-1bbb06931b30.jfif", "f987b9f2-fbd3-403c-a59e-ab1ba82356c6.jfif",
            "f47131a9-bca3-48cf-a5c4-47ebba0efcef.jfif", "fab1c64c-2633-4ec3-9707-2a6b248aaf20.jfif",
            "fe965c4c-fbcf-42a4-89e5-a7c4b68c5f18.jfif"
        ];

        const grid = document.getElementById('gallery-grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        // Отрисовка галереи
        photos.forEach((src, index) => {
            const delay = (index % 10) * 0.05; // Каскадная задержка анимации
            const html = `
                <div class="fade-in group relative overflow-hidden rounded-md cursor-pointer shadow-md aspect-[4/3] bg-navy/5" 
                     style="animation-delay: ${delay}s"
                     onclick="openLightbox('${src}')">
                    <div class="absolute inset-0 bg-navy/20 group-hover:bg-transparent transition-colors duration-500 z-10"></div>
                    <img src="${src}" alt="Фото СНК" loading="lazy" 
                         class="object-cover w-full h-full transform group-hover:scale-110 transition-transform duration-700 ease-in-out">
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', html);
        });

        // Функции Lightbox
        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.remove('hidden');
            lightbox.classList.add('visible');
            document.body.style.overflow = 'hidden'; // Блокируем скролл страницы
        }

        function closeLightbox() {
            lightbox.classList.remove('visible');
            lightbox.classList.add('hidden');
            document.body.style.overflow = ''; // Возвращаем скролл
            setTimeout(() => { lightboxImg.src = ''; }, 300);
        }

        // Закрытие по кнопке Esc
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") closeLightbox();
        });
    </script>
</body>
</html>
